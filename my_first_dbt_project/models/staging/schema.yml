version: 2

models:
  - name: stg_telemetry_events
    description: "Cleaned and typed staging layer for edge telemetry."
    columns:
      - name: device_id
        description: "The unique identifier for the hardware array."
        tests:
          - not_null
      - name: ping_timestamp
        description: "When the payload was generated."
        tests:
          - not_null
      - name: bus_voltage_v
        description: "DC voltage reading."
        tests:
          - not_null