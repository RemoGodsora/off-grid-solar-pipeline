services:
  kafka:
    # Hard-locking to the stable Confluent release
    image: confluentinc/confluent-local:7.6.0
    container_name: kafka_broker
    ports:
      - "9092:9092"
    environment:
      # Strict 16-byte base64 UUID for modern KRaft architecture
      CLUSTER_ID: 'QTc2MzcyMjg3MTRhNDI0OA'
      # Corrected external routing map
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:29092,PLAINTEXT_HOST://localhost:9092

  streaming_db:
    image: postgres:14
    container_name: streaming_db
    ports:
      - "5433:5432" 
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=telemetry

  grafana:
    image: grafana/grafana-oss:latest
    container_name: telemetry_dashboard
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - streaming_db