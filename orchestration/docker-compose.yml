services:
  magic-workspace:
    image: mageai/mageai:latest
    command: mage start capstone_project
    env_file:
      - .env
    environment:
      USER_CODE_PATH: /home/src/capstone_project
    ports:
      - 6789:6789
    volumes:
      # Mounts your entire master Capstone folder into the container
      - ../:/home/src/
    restart: on-failure:5